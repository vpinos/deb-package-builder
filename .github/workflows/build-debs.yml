name: Build Debian packages

on:
  workflow_dispatch:
    inputs:
      package_revision:
        description: Debian package revision
        required: true
        default: "1"
      release_tag:
        description: Base name for the new GitHub Release created by this run
        required: true
        default: vpinos-debs
      vpinball_version:
        description: VPinball (superhac/vpinball) release tag, or latest
        required: true
        default: latest
      vpinfe_version:
        description: VPinFE release tag, or latest
        required: true
        default: latest
      vpxconfig_version:
        description: VPXConfig (vpinos/vpxconfig) release tag, or latest
        required: true
        default: latest
      wivrn_version:
        description: WiVRn (superhac/WiVRn) release tag, or latest
        required: true
        default: latest
      xrizer_version:
        description: xrizer (Supreeeme/xrizer) release tag, or latest
        required: true
        default: latest

permissions:
  contents: write

concurrency:
  group: build-debian-packages
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute unique release tag
        id: tag
        run: echo "release_tag=${{ inputs.release_tag }}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            --title "VPINOS Debian packages ($RELEASE_TAG)" \
            --notes "Debian package assets built by GitHub Actions.

          - vpinball_version: ${{ inputs.vpinball_version }}
          - vpinfe_version: ${{ inputs.vpinfe_version }}
          - architectures: amd64, arm64
          - vpxconfig_version: ${{ inputs.vpxconfig_version }}
          - wivrn_version: ${{ inputs.wivrn_version }}
          - xrizer_version: ${{ inputs.xrizer_version }}
          - package_revision: ${{ inputs.package_revision }}"

  vpinball:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install vpinball packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            dpkg-dev \
            jq

      - name: Build vpinball .deb from release asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VPINBALL_REPO: superhac/vpinball
          VPINBALL_VERSION: ${{ inputs.vpinball_version }}
          DEB_ARCH: ${{ matrix.arch }}
          PACKAGE_REVISION: ${{ inputs.package_revision }}
          OUTDIR: ${{ github.workspace }}/dist/vpinball
        run: scripts/build-vpinball-deb.sh

      - name: Generate checksum
        run: |
          cd dist/vpinball
          for deb in *.deb; do
            sha256sum "$deb" > "$deb.sha256"
          done

      - name: Upload vpinball package to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" dist/vpinball/*.deb dist/vpinball/*.sha256 --clobber

  vpinfe:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        triplet: [linux-x64-slim, linux-arm64-slim]
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install vpinfe packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            dpkg-dev \
            jq \
            unzip

      - name: Build vpinfe .deb from release asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VPINFE_REPO: superhac/vpinfe
          VPINFE_VERSION: ${{ inputs.vpinfe_version }}
          VPINFE_TRIPLET: ${{ matrix.triplet }}
          PACKAGE_REVISION: ${{ inputs.package_revision }}
          OUTDIR: ${{ github.workspace }}/dist/vpinfe
        run: scripts/build-vpinfe-deb.sh

      - name: Generate checksum
        run: |
          cd dist/vpinfe
          for deb in *.deb; do
            sha256sum "$deb" > "$deb.sha256"
          done

      - name: Upload vpinfe package to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" dist/vpinfe/*.deb dist/vpinfe/*.sha256 --clobber

  vpxconfig:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install vpxconfig packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            dpkg-dev \
            jq

      - name: Build vpxconfig .deb from release asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VPXCONFIG_REPO: vpinos/vpxconfig
          VPXCONFIG_VERSION: ${{ inputs.vpxconfig_version }}
          DEB_ARCH: ${{ matrix.arch }}
          PACKAGE_REVISION: ${{ inputs.package_revision }}
          OUTDIR: ${{ github.workspace }}/dist/vpxconfig
        run: scripts/build-vpxconfig-deb.sh

      - name: Generate checksum
        run: |
          cd dist/vpxconfig
          for deb in *.deb; do
            sha256sum "$deb" > "$deb.sha256"
          done

      - name: Upload vpxconfig package to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" dist/vpxconfig/*.deb dist/vpxconfig/*.sha256 --clobber

  wivrn:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install wivrn packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            dpkg-dev \
            jq

      - name: Fetch wivrn .deb from release asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WIVRN_REPO: superhac/WiVRn
          WIVRN_VERSION: ${{ inputs.wivrn_version }}
          DEB_ARCH: ${{ matrix.arch }}
          OUTDIR: ${{ github.workspace }}/dist/wivrn
        run: scripts/build-wivrn-deb.sh

      - name: Generate checksum
        run: |
          cd dist/wivrn
          for deb in *.deb; do
            sha256sum "$deb" > "$deb.sha256"
          done

      - name: Upload wivrn package to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" dist/wivrn/*.deb dist/wivrn/*.sha256 --clobber

  xrizer:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built from source on native runners; upstream only ships x86_64.
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install xrizer build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            build-essential \
            cmake \
            curl \
            dpkg-dev \
            glslc \
            jq \
            libclang-dev \
            libvulkan-dev \
            libx11-xcb-dev \
            pkg-config

      - name: Install Rust toolchain
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build xrizer .deb from source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          XRIZER_REPO: Supreeeme/xrizer
          XRIZER_VERSION: ${{ inputs.xrizer_version }}
          DEB_ARCH: ${{ matrix.arch }}
          PACKAGE_REVISION: ${{ inputs.package_revision }}
          OUTDIR: ${{ github.workspace }}/dist/xrizer
        run: scripts/build-xrizer-deb.sh

      - name: Generate checksum
        run: |
          cd dist/xrizer
          for deb in *.deb; do
            sha256sum "$deb" > "$deb.sha256"
          done

      - name: Upload xrizer package to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" dist/xrizer/*.deb dist/xrizer/*.sha256 --clobber
